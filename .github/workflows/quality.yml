name: HRMS quality gates
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run emails:check
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium firefox webkit
      # Pixel baselines are macOS-specific. Linux runs the cross-browser,
      # accessibility and responsive assertions without rewriting baselines.
      - run: npx playwright test admin-compatibility mobile-navigation security-overview theme-preference
      - run: npm run build
        env:
          # Deliberately non-production. CI never deploys this validation bundle.
          VITE_SUPABASE_URL: https://ci-only.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_validation_only
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npm run test:db:local
      - run: node scripts/verify-security-audit-local.mjs && node scripts/verify-hr-workflows-local.mjs && node scripts/verify-remediation-local.mjs
      - if: always()
        run: npx supabase stop
