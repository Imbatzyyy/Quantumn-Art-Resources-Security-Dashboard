# Quantum HRMS local QA only. Cloud configuration remains managed separately.
project_id = "quantum-hrms-local-qa"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "3m"
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

# Fictional HR records already live in the versioned migrations. Auth accounts
# are created with per-run random passwords by scripts/run-local-authenticated-qa.mjs.
[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:4175"
additional_redirect_urls = [
  "http://127.0.0.1:4175/admin/setup-password",
  "http://127.0.0.1:4175/employee/reset-password"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirm your email address | Quantumn Art Resources"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.invite]
subject = "You’re invited to your HR workspace | Quantumn Art Resources"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your password | Quantumn Art Resources"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your secure sign-in link | Quantumn Art Resources"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your email change | Quantumn Art Resources"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Verify your identity | Quantumn Art Resources"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.notification.password_changed]
# Keep opt-in notification behavior unchanged.
enabled = false
subject = "Your password was changed | Quantumn Art Resources"
content_path = "./supabase/templates/password_changed_notification.html"

[auth.email.notification.email_changed]
# Keep opt-in notification behavior unchanged.
enabled = false
subject = "Your email address was changed | Quantumn Art Resources"
content_path = "./supabase/templates/email_changed_notification.html"

[auth.email.notification.phone_changed]
# Keep opt-in notification behavior unchanged.
enabled = false
subject = "Your sign-in phone number was changed | Quantumn Art Resources"
content_path = "./supabase/templates/phone_changed_notification.html"

[auth.email.notification.identity_linked]
# Keep opt-in notification behavior unchanged.
enabled = false
subject = "A sign-in method was linked | Quantumn Art Resources"
content_path = "./supabase/templates/identity_linked_notification.html"

[auth.email.notification.identity_unlinked]
# Keep opt-in notification behavior unchanged.
enabled = false
subject = "A sign-in method was removed | Quantumn Art Resources"
content_path = "./supabase/templates/identity_unlinked_notification.html"

[auth.email.notification.mfa_factor_enrolled]
# Keep opt-in notification behavior unchanged.
enabled = false
subject = "A verification method was added | Quantumn Art Resources"
content_path = "./supabase/templates/mfa_factor_enrolled_notification.html"

[auth.email.notification.mfa_factor_unenrolled]
# Keep opt-in notification behavior unchanged.
enabled = false
subject = "A verification method was removed | Quantumn Art Resources"
content_path = "./supabase/templates/mfa_factor_unenrolled_notification.html"

[auth.mfa]
max_enrolled_factors = 4

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
